<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} img{max-width:100%} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Генеральная репетиция</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one calm mobile column (~540px) on white, brand loop doodle behind; EVP blue palette for the office audience */
:root{
  --paper:#FFFFFF; --ink:#0E1222; --muted:#4A5068; --line:#E1E7F1;
  --strong:#26348C; --accent:#1D98FF; --soft:#85D6FF; --tint:#CBECFC; --tint2:#EEF8FE;
  --ok:#0E7A4A; --ok-bg:#E3F6EC; --no:#9A3A12; --no-bg:#FCEEE6;
  --on-strong:#FFFFFF;
  --font:'Montserrat','Segoe UI',Arial,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px;overflow-x:hidden}
.bgloop{position:fixed;right:-70px;top:-50px;width:400px;max-width:none;opacity:.3;pointer-events:none;z-index:0;transform:rotate(-12deg)}
.bgloop2{position:fixed;left:-60px;bottom:-40px;width:220px;max-width:none;opacity:.22;pointer-events:none;z-index:0;transform:rotate(160deg)}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:62px;width:auto;display:block}
.pre{color:var(--accent)}
.startwrap{display:flex;flex-direction:column;gap:22px;min-height:calc(100svh - 60px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:center;background:var(--tint2);border-radius:18px;padding:14px 16px;font-size:14px;color:var(--muted)}
.steps img{width:44px;height:44px;object-fit:contain}
.steps b{display:block;font-size:16px;color:var(--ink)}
.spacer{flex:1;display:flex;align-items:center;justify-content:flex-end;min-height:90px}
.mark{font-weight:800;font-style:italic;font-size:20px;color:var(--strong);letter-spacing:-.5px;border:2px solid var(--strong);border-radius:50%;padding:3px 13px;transform:rotate(-4deg)}
.step{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
h1{font-size:clamp(36px,9vw,50px);line-height:1.05;font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:clamp(21px,5vw,25px);line-height:1.3;font-weight:700;margin:0;text-wrap:balance}
p{margin:0}
.lead{font-size:18px;color:var(--muted);max-width:30ch}
.hero{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.facts span{background:var(--tint2);border-radius:40px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--strong);display:inline-flex;gap:8px;align-items:center}
.facts img{width:22px;height:22px;object-fit:contain}
.heroimg{width:130px;height:auto}
.note{font-size:13px;color:var(--muted);text-align:center}
.bar{height:6px;background:var(--tint);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s ease}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--strong);align-self:flex-start}
.chip img{width:26px;height:26px;object-fit:contain}
.opts{display:grid;gap:10px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:13px 15px;font-size:15px;line-height:1.4;background:var(--paper);transition:border-color .15s,background .15s,opacity .2s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .l{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--strong);font-weight:800;font-size:14px}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--strong);background:var(--tint2)}
.opt.sel .l{background:var(--strong);color:var(--on-strong)}
.opt.dim{opacity:.45}
.opt.right{border-color:var(--ok);background:var(--ok-bg);opacity:1}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-bg);opacity:1}
.opt.wrong .l{background:var(--no);color:#fff}
.opt .badge{display:block;font-size:12px;font-weight:700;margin-top:4px;letter-spacing:.3px}
.opt.right .badge{color:var(--ok)}
.opt.wrong .badge{color:var(--no)}
.hint{font-size:13px;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{all:unset;cursor:pointer;min-height:78px;border:2px solid var(--line);border-radius:16px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:10px 6px;font-size:15px;font-weight:700;line-height:1.2;transition:background .15s,border-color .15s,transform .12s,color .15s}
.tile:hover:not([disabled]){border-color:var(--accent)}
.tile:active:not([disabled]){transform:scale(.96)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .tb{font-size:11px;font-weight:700;letter-spacing:.3px;min-height:0}
.tile.sel{background:var(--strong);border-color:var(--strong);color:var(--on-strong)}
.tile.sel .tb::before{content:'✓'}
.tile[disabled]{cursor:default}
.tile.right{background:var(--ok-bg);border-color:var(--ok)}
.tile.right .tb{color:var(--ok)}
.tile.miss{border-style:dashed;border-color:var(--ok)}
.tile.miss .tb{color:var(--ok)}
.tile.wrong{background:var(--no-bg);border-color:var(--no)}
.tile.wrong .tb{color:var(--no)}
.tile.other{opacity:.5}
.tile.other .tb{color:var(--muted)}
@media (max-width:340px){.tiles{grid-template-columns:repeat(2,1fr)}}
.fb{display:flex;flex-direction:column;gap:12px;animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.verdict{border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--ok-bg)}
.verdict.no{background:var(--tint2)}
.verdict b{font-size:16px}
.verdict.ok b{color:var(--ok)}
.verdict.no b{color:var(--strong)}
.tip{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--strong);color:var(--on-strong);border-radius:18px;padding:16px 18px;font-size:15px}
.tip img{width:34px;height:34px;object-fit:contain;filter:brightness(0) invert(1)}
.tip small{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--soft);margin-bottom:2px}
.btn{all:unset;cursor:pointer;text-align:center;background:var(--strong);color:var(--on-strong);font-weight:700;font-size:16px;border-radius:40px;padding:16px 24px;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn[disabled]{opacity:.4;cursor:default;transform:none;filter:none}
.btn.ghost{background:transparent;color:var(--strong);border:2px solid var(--strong);padding:14px 22px}
.btn.light{background:var(--paper);color:var(--strong)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 180px}
.score{display:flex;align-items:center;gap:18px;background:var(--tint2);border-radius:22px;padding:20px}
.score .big{font-size:56px;font-weight:800;line-height:1;color:var(--strong);font-variant-numeric:tabular-nums;white-space:nowrap}
.score .big span{font-size:26px;color:var(--muted)}
.score p{font-size:15px;color:var(--muted)}
.score b{display:block;font-size:19px;color:var(--ink);line-height:1.25;margin-bottom:4px}
.sheet{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.sheet li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:15px;align-items:start}
.sheet li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--strong);display:grid;place-items:center;font-weight:800;font-size:13px}
.lbl{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--strong)}
.box{display:flex;flex-direction:column;gap:12px}
.vote{background:var(--strong);color:var(--on-strong);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px}
.vote .lbl{color:var(--soft)}
.vote p{color:#E6EAF8;font-size:15px}
.vote .name{font-weight:800;color:#fff}
.vote small{font-size:12px;color:#C9D0EE}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-size:14px;font-weight:600;z-index:5}
.foot{font-size:12px;color:var(--muted);text-align:center}

.flash{min-height:24px;text-align:center;font-size:15px;font-weight:700;color:var(--muted);margin-top:-6px}
.flash.ok{color:var(--ok)} .flash.no{color:var(--no)}
.stackwrap{display:flex;justify-content:center;padding-top:4px}
.stack{position:relative;width:min(300px,82vw);height:360px}
.card{position:absolute;inset:0;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 22px;text-align:center;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;background:#FFFFFF;border:1px solid var(--line);box-shadow:0 22px 44px -20px rgba(38,52,140,.45);transition:transform .25s ease;overflow:hidden;color:var(--muted)}
.card::before{content:"";position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(0deg,var(--tint2),rgba(238,248,254,0))}
.clogo{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.clogo img{max-width:88%;max-height:210px;object-fit:contain;border-radius:14px;pointer-events:none}
.card .cq{position:relative;z-index:1}
.card:active{cursor:grabbing}
.card.behind{filter:saturate(.6) brightness(1.03);pointer-events:none}

.c-home{background:linear-gradient(155deg,#26348C 0%,#1D98FF 100%);color:#fff}
.c-ice{background:linear-gradient(155deg,#1D98FF 0%,#85D6FF 100%);color:#0E1222}
.c-care{background:linear-gradient(155deg,#85D6FF 0%,#CBECFC 100%);color:#0E1222}
.ccat{position:absolute;left:18px;top:18px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:rgba(255,255,255,.85);color:var(--strong);padding:5px 12px;border-radius:30px}
.cic{width:96px;height:96px;object-fit:contain;pointer-events:none}
.c-home .cic{filter:brightness(0) invert(1)}
.cname{font-size:30px;font-weight:800;line-height:1.1;text-wrap:balance}
.cq{font-size:14px;font-weight:600;opacity:.8}
.stamp{position:absolute;top:24px;font-size:22px;font-weight:800;letter-spacing:2px;padding:6px 14px;border:3px solid;border-radius:10px;opacity:0;background:rgba(255,255,255,.9);z-index:2}
.stamp.yes{right:18px;color:var(--ok);transform:rotate(10deg)}
.stamp.no{left:18px;color:var(--no);transform:rotate(-10deg)}
.done{position:absolute;inset:0;border-radius:28px;background:var(--tint2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;animation:rise .4s ease both}
.done img{width:72px;height:72px;object-fit:contain}
.done b{font-size:40px;font-weight:800;color:var(--strong)}
.done span{font-size:15px;color:var(--muted);font-weight:600}
.swbtns{display:flex;align-items:center;justify-content:space-between;gap:12px}
.swb{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;padding:14px 22px;border-radius:40px;border:2px solid}
.swb span{font-size:18px}
.swb.no{color:var(--no);border-color:var(--no)}
.swb.yes{color:#fff;background:var(--strong);border-color:var(--strong)}
.swb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.swb:active{transform:scale(.96)}
.cnt{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.verdict .miss{font-weight:700;color:var(--no)}
.chathead{display:flex;align-items:center;gap:12px;background:var(--tint2);border-radius:18px;padding:12px 14px}
.cava{width:46px;height:46px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none}
.cava img{width:32px;height:32px;object-fit:contain}
.chathead b{display:block;font-size:16px}
.chathead span{font-size:13px;color:var(--accent);font-weight:600}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:12px 15px;border-radius:18px;font-size:15px;line-height:1.45;animation:rise .3s ease both}
.msg.bot{align-self:flex-start;background:var(--tint2);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--strong);color:var(--on-strong);border-bottom-right-radius:6px}
.msg.ok{background:var(--ok-bg)}
.msg.no{background:var(--tint2)}
.msg .vok{color:var(--ok)} .msg .vno{color:var(--strong)}
.msg .our{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.msg .mstd{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.msg.tipmsg{background:var(--strong);color:var(--on-strong);display:grid;grid-template-columns:30px 1fr;gap:10px}
.msg.tipmsg .tipic{width:30px;height:30px;object-fit:contain;filter:brightness(0) invert(1)}
.msg.tipmsg small{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--soft);margin-bottom:2px}
.typing{display:flex;gap:5px;padding:16px 18px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.4;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}
.replies{display:flex;flex-direction:column;gap:8px;align-items:flex-end;padding-top:4px}
.rep{all:unset;cursor:pointer;max-width:90%;border:2px solid var(--strong);color:var(--strong);background:var(--paper);border-radius:18px;border-bottom-right-radius:6px;padding:11px 15px;font-size:15px;font-weight:600;line-height:1.4;text-align:left;animation:rise .3s ease both;transition:background .15s,color .15s}
.rep:hover{background:var(--tint2)}
.rep:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

<img class="bgloop2" id="bg2" alt="">
<main class="wrap" id="app" aria-live="polite"></main>
<div class="toast" id="toast" hidden></div>

const state = {score:0};
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img = (k, cls='') => `<img src="${ASSETS[k]}" alt="" class="${cls}">`;
document.getElementById('bg1').src = ASSETS.big;
document.getElementById('bg2').src = ASSETS.squig;
const topbar = (right='') => `<div class="top"><img class="logo" src="${LOGO}" alt="Арнест ЮниРусь"><span class="step">${right}</span></div>`;
const go = fn => { fn(); window.scrollTo({top:0, behavior:'smooth'}); };
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const k=Math.floor(Math.random()*(i+1)); [a[i],a[k]]=[a[k],a[i]]; } return a; }

function start(){
  state.score=0;
  app.innerHTML = `
    <div class="startwrap">
      ${topbar()}
      <section class="hero">
        <h1>Генеральная <em>репетиция</em></h1>
        <p class="lead">Подготовься к собеседованию в ЮниРусь за 3 минуты</p>
      </section>
      <ol class="steps">
        <li>${img('flower')}<span><b>Разминка</b>Свайпни наши бренды</span></li>
        <li>${img('five')}<span><b>4 рабочие ситуации</b>Посмотри, как принято у нас</span></li>
        <li>${img('check')}<span><b>Шпаргалка</b>Советы к твоему собеседованию</span></li>
      </ol>
      <div class="spacer">${img('grow','heroimg')}</div>
      <button class="btn" id="go">Начать</button>
      <p class="note">Игра не влияет на рассмотрение твоего отклика</p>
    </div>`;
  document.getElementById('go').onclick = () => go(swipeRound);
}

/* ---------- Раунд 1: свайпы ---------- */
function swipeRound(){
  const deck = shuffle(BRANDS.slice());
  let idx = 0; const mistakes = []; let busy = false;
  app.innerHTML = `
    ${topbar(`1 / ${TOTAL}`)}
    <div class="bar"><i style="width:0%"></i></div>
    <span class="chip">${img('flower')}Разминка</span>
    <h2>Ты знаешь нас лучше, чем думаешь. Наш это бренд или нет?</h2>
    <p class="hint">Свайп вправо — наш, влево — не наш</p>
    <div class="stackwrap"><div class="stack" id="stack"></div></div>
    <p class="flash" id="flash" aria-live="polite">&nbsp;</p>
    <div class="swbtns" id="swbtns">
      <button class="swb no" id="bNo" aria-label="Не наш бренд"><span>✕</span>Не наш</button>
      <span class="cnt" id="cnt">1 / ${deck.length}</span>
      <button class="swb yes" id="bYes" aria-label="Наш бренд"><span>✓</span>Наш</button>
    </div>
    <div id="fb"></div>`;
  requestAnimationFrame(() => { app.querySelector('.bar i').style.width = (1/TOTAL*100)+'%'; });
  const stack = document.getElementById('stack');
  const cardHTML = (b, n) => {
    const c = CAT[b.cat];
    return `<div class="card" data-n="${n}">
      <span class="stamp yes">НАШ</span><span class="stamp no">НЕ НАШ</span>
      <div class="clogo"><img src="${BRAND_LOGOS[b.t]}" alt="${esc(b.t)}" draggable="false"></div>
      <span class="cq">Это наш бренд?</span>
    </div>`;
  };
  function render(){
    stack.innerHTML = '';
    for(let k = Math.min(idx+2, deck.length-1); k >= idx; k--) stack.insertAdjacentHTML('beforeend', cardHTML(deck[k], k));
    stack.querySelectorAll('.card').forEach(el => { const d = +el.dataset.n - idx; el.style.transform = `translateY(${d*12}px) scale(${1-d*0.05})`; el.style.zIndex = 10-d; if(d>0) el.classList.add('behind'); });
    const top = stack.querySelector(`.card[data-n="${idx}"]`);
    if(top) bindDrag(top);
    document.getElementById('cnt').textContent = `${Math.min(idx+1, deck.length)} / ${deck.length}`;
  }
  function bindDrag(el){
    let x0=0, y0=0, dx=0, dragging=false;
    el.addEventListener('pointerdown', e => { if(busy) return; dragging=true; x0=e.clientX; y0=e.clientY; dx=0; el.setPointerCapture(e.pointerId); el.style.transition='none'; });
    el.addEventListener('pointermove', e => {
      if(!dragging) return; dx = e.clientX - x0; const dy = (e.clientY - y0) * 0.15;
      el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx/18}deg)`;
      el.querySelector('.stamp.yes').style.opacity = Math.max(0, Math.min(1, dx/90));
      el.querySelector('.stamp.no').style.opacity = Math.max(0, Math.min(1, -dx/90));
    });
    const end = () => {
      if(!dragging) return; dragging=false; el.style.transition='';
      if(Math.abs(dx) > 90) decide(dx > 0);
      else { el.style.transform=''; el.querySelectorAll('.stamp').forEach(s => s.style.opacity=0); }
    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  }
  async function decide(saysOurs){
    if(busy || idx >= deck.length) return; busy = true;
    const b = deck[idx], el = stack.querySelector(`.card[data-n="${idx}"]`);
    const right = saysOurs === b.ok;
    if(!right) mistakes.push(b.t);
    el.style.transition = 'transform .35s ease, opacity .35s ease';
    el.style.transform = `translate(${saysOurs ? 520 : -520}px, 30px) rotate(${saysOurs ? 24 : -24}deg)`;
    el.style.opacity = '0';
    const fl = document.getElementById('flash');
    fl.className = 'flash ' + (right ? 'ok' : 'no');
    fl.textContent = right ? (b.ok ? `Верно! ${b.t} — наш бренд` : `Верно! ${b.t} — не наш бренд`) : (b.ok ? `${b.t} — наш бренд` : `${b.t} — бренд другой компании`);
    await wait(330);
    idx++;
    if(idx < deck.length){ render(); busy = false; }
    else finishSwipes();
  }
  function finishSwipes(){
    stack.innerHTML = `<div class="done">${img('check')}<b>${deck.length - mistakes.length} из ${deck.length}</b><span>верных ответов</span></div>`;
    document.getElementById('swbtns').remove(); document.getElementById('flash').remove(); document.removeEventListener('keydown', onKey);
    const ok = mistakes.length <= 1;
    if(ok) state.score++;
    const head = mistakes.length === 0 ? 'Верно: все бренды угаданы!' : ok ? 'Почти идеально!' : 'Есть ошибки';
    let text = 'Доместос, Глорикс, Золотой Стандарт, Магнат, Экзо, Рексона, Дав и Акс создаём мы — Арнест ЮниРусь. Нивея, Палмолив и Хэд энд Шолдерс делают другие компании. И это лишь несколько наших брендов: на самом деле их гораздо больше.';
    document.getElementById('fb').innerHTML = `
      <div class="fb">
        <div class="verdict ${ok?'ok':'no'}"><b>${head}</b>${mistakes.length ? `<p class="miss">Ошибки: ${mistakes.map(esc).join(', ')}</p>` : ''}<p>${text}</p></div>
        <div class="tip">${img('check')}<div><small>Совет к собеседованию</small>${BRAND_TIP}</div></div>
        <button class="btn" id="next">Дальше</button>
      </div>`;
    document.getElementById('next').onclick = () => go(() => roundQ(0));
    setTimeout(() => document.getElementById('fb').scrollIntoView({behavior:'smooth', block:'nearest'}), 100);
  }
  const onKey = e => { if(e.key==='ArrowRight') decide(true); if(e.key==='ArrowLeft') decide(false); };
  document.addEventListener('keydown', onKey);
  document.getElementById('bYes').onclick = () => decide(true);
  document.getElementById('bNo').onclick = () => decide(false);
  render();
}

/* ---------- Раунды 2–5: ситуации ---------- */
const ICONS = ['five','trophy','grow','bulb'];
function roundQ(k){
  const R = Q[k], step = k+2;
  app.innerHTML = `
    ${topbar(`${step} / ${TOTAL}`)}
    <div class="bar"><i style="width:${(step-1)/TOTAL*100}%"></i></div>
    <span class="chip">${img(ICONS[k])}${esc(R.std)}</span>
    <h2><span class="pre">Представь ситуацию:</span> ${esc(R.q)}</h2>
    <div class="opts" role="group" aria-label="Варианты ответа">
      ${R.o.map((o,j) => `<button class="opt" data-j="${j}"><span class="l">${L[j]}</span><span class="t">${esc(o.t)}</span></button>`).join('')}
    </div>
    <div id="fb"></div>`;
  requestAnimationFrame(() => { app.querySelector('.bar i').style.width = (step/TOTAL*100)+'%'; });
  let done = false;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if(done) return; done = true;
    const j = +b.dataset.j, right = R.o.findIndex(o => o.ok), ok = j === right;
    if(ok) state.score++;
    app.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.add('dim'); });
    const mark = (n, cls, label) => {
      const el = app.querySelector(`.opt[data-j="${n}"]`);
      el.classList.remove('dim'); el.classList.add(cls);
      el.querySelector('.t').insertAdjacentHTML('beforeend', `<span class="badge">${label}</span>`);
    };
    mark(right, 'right', 'Наш подход');
    if(!ok) mark(j, 'wrong', 'Твой ответ');
    const last = k === Q.length-1, fb = document.getElementById('fb');
    fb.innerHTML = `
      <div class="fb">
        <div class="verdict ${ok?'ok':'no'}"><b>${ok ? 'Да, это наш подход' : 'У нас принято иначе'}</b><p>${esc(R.o[j].f)}</p></div>
        <div class="tip">${img('check')}<div><small>Совет к собеседованию</small>${esc(R.tip)}</div></div>
        <button class="btn" id="next">${last ? 'Мой результат' : 'Дальше'}</button>
      </div>`;
    document.getElementById('next').onclick = () => go(() => last ? final() : roundQ(k+1));
    setTimeout(() => fb.scrollIntoView({behavior:'smooth', block:'nearest'}), 100);
  });
}

function final(){
  const s = state.score, n = TOTAL;
  const title = s===n ? 'Ты уже думаешь, как мы' : s>=3 ? 'У нас тебе будет комфортно' : 'Хорошее начало';
  const sub = s===n ? 'Твой подход к работе совпадает с нашим.' : s>=3 ? 'Многое в нашем подходе тебе уже близко.' : 'Теперь ты знаешь, что для нас важно.';
  app.innerHTML = `
    ${topbar('Готово')}
    <div class="bar"><i style="width:100%"></i></div>
    <h1>Репетиция <em>пройдена</em></h1>
    <div class="score"><div class="big">${s}<span>/${n}</span></div><div><b>${title}</b><p>${sub}</p></div></div>
    <div class="box">
      <span class="lbl">Шпаргалка к собеседованию</span>
      <ol class="sheet">${TIPS.map(x => `<li><span>${esc(x)}</span></li>`).join('')}</ol>
      <button class="btn ghost" id="copy">Скопировать шпаргалку</button>
    </div>
    <div class="vote">
      <span class="lbl">Одна просьба</span>
      <h2>Поддержи нас в Рейтинге работодателей hh.ru</h2>
      <p>Это займёт минуту. Ищи нас как <span class="name">Арнест ЮниРусь</span>.</p>
      <a class="btn light" href="${VOTE_URL}" target="_blank" rel="noopener">Проголосовать</a>
      <small>Голос не влияет на рассмотрение отклика</small>
    </div>
    <div class="row">
      <button class="btn ghost" id="share">Поделиться</button>
      <button class="btn ghost" id="again">Пройти ещё раз</button>
    </div>
    <p class="foot">Прототип · трек «Офис»</p>`;
  const sheet = 'Шпаргалка к собеседованию в ЮниРусь\n' + TIPS.map((x,i) => `${i+1}. ${x}`).join('\n');
  const share = `Прошёл «Генеральную репетицию» ЮниРусь: ${s} из ${n} совпадений с их подходом к работе. Попробуй и ты!`;
  document.getElementById('copy').onclick = () => copy(sheet, 'Шпаргалка скопирована');
  document.getElementById('share').onclick = () => copy(share, 'Текст скопирован');
  document.getElementById('again').onclick = () => go(start);
}

function copy(text, msg){
  const done = () => toast(msg);
  try{ navigator.clipboard.writeText(text).then(done).catch(() => fallback(text, done)); }
  catch(e){ fallback(text, done); }
}
function fallback(text, done){
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('Не получилось скопировать'); }
  ta.remove();
}
let tt;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); }

start();
</script>
